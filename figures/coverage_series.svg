<text x="72" y="430" font-size="10.5" fill="#52514e">The series starts in 2019 because that is where the data starts: ARM first published a machine-readable specification in 2017-04 (Armv8.2-A),</text>
<text x="72" y="444" font-size="10.5" fill="#52514e">and its 2017-04 to 2019-09 releases are no longer served, so 2019-12 is the earliest obtainable A64 release. Nothing earlier exists to measure.</text>
